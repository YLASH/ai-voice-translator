<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #111; }
    .upload-area {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: #888; }
    .upload-area p { color: #888; font-size: 0.9rem; margin-top: 0.5rem; }
    input[type="file"] { display: none; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #333; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .result {
      margin-top: 1.5rem;
      display: none;
    }
    .result-box {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .result-box label {
      font-size: 0.75rem;
      color: #888;
      display: block;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    audio { width: 100%; margin-top: 0.5rem; }
    .error { color: #c0392b; font-size: 0.9rem; margin-top: 1rem; }
    .filename { font-size: 0.85rem; color: #555; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎙️ AI Voice Translator</h1>

    <div class="upload-area" onclick="document.getElementById('audioInput').click()">
      <div style="font-size: 2rem;">📁</div>
      <p>Click to upload audio file</p>
      <p>.mp3 / .wav / .m4a</p>
    </div>
    <input type="file" id="audioInput" accept=".mp3,.wav,.m4a" onchange="showFilename(this)">
    <div class="filename" id="filename"></div>

    <button onclick="upload()" id="btn" style="margin-top: 1rem;">Translate</button>

    <div class="result" id="result">
      <div class="result-box">
        <label>Original</label>
        <div id="original"></div>
      </div>
      <div class="result-box">
        <label>Translated</label>
        <div id="translated"></div>
      </div>
      <div class="result-box">
        <label>Audio Output</label>
        <audio id="audioPlayer" controls></audio>
      </div>
    </div>

    <div class="error" id="error"></div>
  </div>

  <script>
    function showFilename(input) {
      const name = input.files[0]?.name || "";
      document.getElementById("filename").textContent = name ? `Selected: ${name}` : "";
    }

    async function upload() {
      const fileInput = document.getElementById("audioInput");
      const btn = document.getElementById("btn");
      const errorDiv = document.getElementById("error");
      const resultDiv = document.getElementById("result");

      errorDiv.textContent = "";
      resultDiv.style.display = "none";

      if (!fileInput.files[0]) {
        errorDiv.textContent = "Please select an audio file first.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Processing...";

      const formData = new FormData();
      formData.append("audio", fileInput.files[0]);

      try {
        const res = await fetch("/process", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.error) {
          errorDiv.textContent = "Error: " + data.error;
        } else {
          document.getElementById("original").textContent = data.original;
          document.getElementById("translated").textContent = data.translated;
          document.getElementById("audioPlayer").src = data.audio_url;
          resultDiv.style.display = "block";
        }
      } catch (err) {
        errorDiv.textContent = "Something went wrong. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Translate";
      }
    }
  </script>
</body>
</html>
